[project]
name = "eval_vla"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-clip>=1.0.1",
    "setuptools<81",  # openai-clip imports pkg_resources, removed in newer setuptools
    "ftfy>=6.3.1,<7",
    "mediapipe>=1.2.2,<2",
    "ollama>=0.6.3,<1",
    "pin>=2.7.0,<4.2",
    "regex>=2026.9.29",
    "rerun-sdk>=0.23.1,<0.44",
    "timm>=1.0.30,<2",
    "trossen_arm>=1.9.0,<1.10.0",
    "ultralytics>=8.4.183,<9",
    "lap>=0.5.12",
    "wandb>=0.20,<1",
]

[project.optional-dependencies]
hf = [
    "accelerate>=1.16,<2",
    "transformers>=5.24,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval_vla = ["metrics/models/*.urdf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
